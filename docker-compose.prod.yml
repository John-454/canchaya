services:
  db:
    image: postgres:16-alpine
    container_name: canchaya_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canchaya}
      POSTGRES_USER: ${POSTGRES_USER:-canchaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canchaya}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - canchaya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canchaya} -d ${POSTGRES_DB:-canchaya}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: canchaya_backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE: /api/v1
    container_name: canchaya_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  canchaya_pgdata:
